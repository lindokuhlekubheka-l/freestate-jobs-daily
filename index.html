<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free State Jobs Daily | Professional Job Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#FCFCF9;color:#121212}
:root{--green:#111F15;--accent:#2E7D32;--line:#E9E6DF;--muted:#6E6E73}
h1,h2{font-family:'Instrument Serif',serif}
header{position:sticky;top:0;z-index:40;background:rgba(252,252,249,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:0 24px;height:68px;display:flex;align-items:center;justify-content:space-between}
.brand-mark{width:36px;height:36px;background:#111F15;color:#fff;display:grid;place-items:center;font-weight:800;border-radius:6px}
.nav-btn{padding:8px 16px;border-radius:999px;border:1px solid transparent;background:transparent;font-size:13.5px;font-weight:500;cursor:pointer}
.nav-btn.active{background:#111F15;color:#fff}
.hero{max-width:1280px;margin:0 auto;padding:56px 24px 32px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px}
.hero h1{font-size:clamp(40px,6vw,68px);line-height:.92}
.hero h1 i{font-style:italic}
.grid-jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.job{background:#fff;border:1px solid #E9E6DF;border-radius:16px;padding:18px 20px;cursor:pointer}
.job:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.06)}
.pill{font-size:11px;padding:5px 9px;border-radius:999px;border:1px solid #E9E6DF}
.pill.green{background:#E8F5E9;color:#2E7D32}
.pill.gold{background:#FFFBEB;color:#7A5D00}
.town{border:1px solid #E9E6DF;background:#fff;padding:8px 14px;border-radius:999px;cursor:pointer}
.town.active{background:#111F15;color:#fff}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(18,18,18,.45);display:none;align-items:center;justify-content:center;z-index:80;padding:20px}
.modal-inner{background:#fff;max-width:560px;width:100%;border-radius:20px;padding:24px}
</style>
</head>
<body>
<header>
  <div style="display:flex;gap:12px;align-items:center"><div class="brand-mark">FS</div><b>Free State Jobs Daily</b></div>
  <nav><button class="nav-btn active" data-page="home">Home</button><button class="nav-btn" data-page="jobs">All Jobs</button><button class="nav-btn" data-page="towns">Towns</button><button class="nav-btn" data-page="robot">Robot</button></nav>
</header>
<!-- Use full file from download above for complete working code -->
</body>
</html>
